trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  ARM_SUBSCRIPTION_ID: 'f81d425e-8d88-4693-bf4e-d6ee9cc8d234'
  ARM_TENANT_ID: '3f0ee158-19fe-4d65-a591-89ce5602a694'

steps:

# ✅ Checkout GitHub Repo
- checkout: self

# ✅ Install Terraform (NO TerraformInstaller task)
- task: Bash@3
  displayName: "Install Terraform"
  inputs:
    targetType: 'inline'
    script: |
      sudo apt-get update
      sudo apt-get install -y unzip
      wget https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
      unzip terraform_1.8.5_linux_amd64.zip
      sudo mv terraform /usr/local/bin/
      terraform -version

# ✅ Azure Login (Service Connection)
- task: AzureCLI@2
  displayName: "Terraform Init"
  inputs:
    azureSubscription: "terraform_spn_internal"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      terraform init

# ✅ Terraform Plan
- task: AzureCLI@2
  displayName: "Terraform Plan"
  inputs:
    azureSubscription: "terraform_spn_internal"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      terraform plan

# ✅ Terraform Apply (Auto-approve)
- task: AzureCLI@2
  displayName: "Terraform Apply"
  inputs:
    azureSubscription: "terraform_spn_internal"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      terraform apply -auto-approve
